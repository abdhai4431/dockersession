name: CI pipeline

on:
    pull_request:
        branches: [feature]
    workflow_dispatch:

jobs:
    frontend-ci:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v6
              
            - name: node setup
              uses: actions/setup-node@v7
              with:
                node-version: 22
                cache: 'npm'
                cache-dependency-path: frontend/package-lock.json
            
            - name: install dependencies
              working-directory: frontend 
              run: npm ci

            - name: lint-check 
              working-directory: frontend
              run: npm run lint

            - name: build code
              working-directory: frontend
              run: npm run build

            
