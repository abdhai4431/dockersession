name: CD pipeline

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    app-cd:
        runs-on: self-hosted
        steps:
            - name: checkout code
              uses: actions/checkout@v6

            - name: login to docker
              uses: docker/login-action@v4
              with: 
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: pull frontend image
              run: docker pull docker.io/${{vars.DOCKERHUB_USERNAME}}/todo-frontend:latest

            - name: pull backend image
              run: docker pull docker.io/${{vars.DOCKERHUB_USERNAME}}/todo-backend:latest

            - name: check config
              run: docker compose -f compose.prod.yaml config

            - name: deploy
              run: docker compose up -d -f compose.prod.yaml --no-build